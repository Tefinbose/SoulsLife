<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg-2" x1="0" y1="0" x2="400" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#FDF2F9"/>
    </linearGradient>
    <linearGradient id="board-grad" x1="140" y1="40" x2="260" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="210" y1="100" x2="280" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A3248F" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow-2" x="110" y="30" width="180" height="190" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#bg-2)"/>

  <!-- Subtle circles -->
  <circle cx="200" cy="125" r="95" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="310" cy="70" r="40" fill="#C084FC" fill-opacity="0.12"/>
  <circle cx="90" cy="180" r="45" fill="#E879F9" fill-opacity="0.12"/>

  <!-- Grounding shadow -->
  <ellipse cx="200" cy="208" rx="90" ry="10" fill="#E9D5FF" fill-opacity="0.45"/>

  <!-- Clipboard -->
  <g filter="url(#shadow-2)">
    <!-- Backboard -->
    <rect x="135" y="48" width="130" height="152" rx="16" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1.5"/>
    
    <!-- Paper Sheet -->
    <rect x="145" y="58" width="110" height="132" rx="10" fill="url(#board-grad)"/>

    <!-- Clip at top -->
    <rect x="180" y="42" width="40" height="14" rx="5" fill="#A3248F"/>
    <rect x="190" y="38" width="20" height="6" rx="3" fill="#C026D3"/>

    <!-- Checklist rows -->
    <!-- Row 1 -->
    <circle cx="162" cy="80" r="6" fill="#A3248F"/>
    <path d="M159 80L161.5 82.5L165.5 77.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="175" y="77" width="65" height="6" rx="3" fill="#E9D5FF"/>

    <!-- Row 2 -->
    <circle cx="162" cy="104" r="6" fill="#A3248F"/>
    <path d="M159 104L161.5 106.5L165.5 101.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="175" y="101" width="55" height="6" rx="3" fill="#E9D5FF"/>

    <!-- Row 3 -->
    <circle cx="162" cy="128" r="6" fill="#A3248F"/>
    <path d="M159 128L161.5 130.5L165.5 125.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="175" y="125" width="60" height="6" rx="3" fill="#E9D5FF"/>

    <!-- Row 4 (neutral) -->
    <circle cx="162" cy="152" r="6" stroke="#C084FC" stroke-width="1.5" fill="none"/>
    <rect x="175" y="149" width="45" height="6" rx="3" fill="#F3E8FF"/>
  </g>

  <!-- Magnifying Glass focusing on row 2/3 -->
  <g>
    <!-- Lens border & glass -->
    <circle cx="235" cy="135" r="32" fill="url(#glass-grad)" stroke="#A3248F" stroke-width="4"/>
    <circle cx="235" cy="135" r="28" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Glare highlight -->
    <path d="M220 118C230 112 245 114 252 122" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Handle -->
    <line x1="258" y1="158" x2="284" y2="184" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    <line x1="264" y1="164" x2="282" y2="182" stroke="#A3248F" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

