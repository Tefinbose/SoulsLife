<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg-5" x1="0" y1="0" x2="400" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#FDF2F9"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="chart-area" x1="200" y1="60" x2="200" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A3248F" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="stroke-grad" x1="80" y1="180" x2="310" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3248F"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow-5" x="80" y="50" width="250" height="150" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A3248F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#bg-5)"/>

  <!-- Background decorative wellness card -->
  <rect x="75" y="45" width="250" height="155" rx="20" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>

  <!-- Horizontal grid guidelines -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="#F3E8FF" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="100" y1="115" x2="300" y2="115" stroke="#F3E8FF" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="100" y1="150" x2="300" y2="150" stroke="#F3E8FF" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="100" y1="175" x2="300" y2="175" stroke="#E9D5FF" stroke-width="1.5"/>

  <!-- Vertical bar indicators in background -->
  <rect x="120" y="145" width="16" height="30" rx="4" fill="#FDF2F9"/>
  <rect x="165" y="125" width="16" height="50" rx="4" fill="#FDF2F9"/>
  <rect x="210" y="105" width="16" height="70" rx="4" fill="#FDF2F9"/>
  <rect x="255" y="80" width="16" height="95" rx="4" fill="#F5F3FF"/>

  <!-- Translucent Area under rising curve -->
  <path d="M105 170 C140 168, 160 145, 190 135 C230 120, 260 85, 295 68 L295 175 L105 175 Z" fill="url(#chart-area)"/>

  <!-- Rising smooth trajectory curve -->
  <g filter="url(#shadow-5)">
    <path d="M105 170 C140 168, 160 145, 190 135 C230 120, 260 85, 295 68" stroke="url(#stroke-grad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Milestone Nodes -->
  <circle cx="105" cy="170" r="5" fill="#A3248F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="168" cy="142" r="5.5" fill="#C026D3" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="230" cy="110" r="6" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Peak Success Milestone (Glowing Emerald Dot with Check) -->
  <circle cx="295" cy="68" r="14" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="295" cy="68" r="8.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M292 68L294.5 70.5L298 66" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Achievement Badge -->
  <g>
    <rect x="235" y="42" width="50" height="20" rx="10" fill="#FFFFFF" stroke="#E9D5FF"/>
    <text x="260" y="55" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#10B981" text-anchor="middle">+85%</text>
  </g>
</svg>

