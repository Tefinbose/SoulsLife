<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg-1" x1="0" y1="0" x2="400" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDF2F9"/>
      <stop offset="50%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="bubble-purple" x1="120" y1="60" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#A3248F"/>
    </linearGradient>
    <linearGradient id="bubble-light" x1="180" y1="90" x2="280" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="shadow-1" x="90" y="50" width="220" height="160" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#A3248F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg-1)"/>
  
  <!-- Subtle decorative ambient circles -->
  <circle cx="80" cy="60" r="45" fill="#E879F9" fill-opacity="0.12"/>
  <circle cx="320" cy="190" r="55" fill="#A3248F" fill-opacity="0.08"/>
  <circle cx="200" cy="125" r="90" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Grounding shadow -->
  <ellipse cx="200" cy="205" rx="100" ry="12" fill="#E9D5FF" fill-opacity="0.4"/>

  <!-- Left Speech Bubble (Deep Purple/Magenta) -->
  <g filter="url(#shadow-1)">
    <path d="M120 75C120 63.9543 128.954 55 140 55H210C221.046 55 230 63.9543 230 75V115C230 126.046 221.046 135 210 135H155L132 152C129.5 154 125 152.5 125 149V135C122.239 135 120 132.761 120 130V75Z" fill="url(#bubble-purple)"/>
    <!-- Dialogue Dots -->
    <circle cx="155" cy="95" r="4.5" fill="#FFFFFF"/>
    <circle cx="175" cy="95" r="4.5" fill="#FFFFFF"/>
    <circle cx="195" cy="95" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Right Speech Bubble (Warm White / Frosted Glass with Heart) -->
  <g filter="url(#shadow-1)">
    <path d="M170 115C170 103.954 178.954 95 190 95H260C271.046 95 280 103.954 280 115V155C280 166.046 271.046 175 260 175H245V189C245 192.5 240.5 194 238 192L215 175H190C178.954 175 170 166.046 170 155V115Z" fill="url(#bubble-light)" stroke="#E9D5FF" stroke-width="1.5"/>
    
    <!-- Empathy Heart Icon inside second bubble -->
    <path d="M225 127C221.5 122.5 214 123.5 214 130C214 136 225 144 225 144C225 144 236 136 236 130C236 123.5 228.5 122.5 225 127Z" fill="#A3248F"/>
  </g>

  <!-- Floating Sparkles / Empathy Radiance -->
  <circle cx="280" cy="75" r="3" fill="#A3248F" fill-opacity="0.4"/>
  <circle cx="115" cy="165" r="2.5" fill="#A3248F" fill-opacity="0.4"/>
  <circle cx="295" cy="130" r="2" fill="#C026D3" fill-opacity="0.5"/>
</svg>

